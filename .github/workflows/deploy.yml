# This workflow will install a prebuilt Ruby version, install dependencies, and
# run tests and linters.
on:
  push:
    branches: "**"
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -t ed25519 ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts
      - run: ssh -t ${{ secrets.PRODUCTION_USERNAME }}@${{ secrets.PRODUCTION_HOST }} 'roamio-deploy'
