# This workflow uses actions that are not certified by GitHub.  They are
# provided by a third-party and are governed by separate terms of service,
# privacy policy, and support documentation.
#
# This workflow will install a prebuilt Ruby version, install dependencies, and
# run tests and linters.
name: "Ruby on Rails CI"
on:
  push:
    branches: "**"
  pull_request:
    branches: [ "main" ]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:11-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_test"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Set up database schema
        run: bin/bundle exec rails db:schema:load

      # Manually compile test assets with rake precompile
      - name: Run tests
        run: RAILS_ENV=test bin/bundle exec rake assets:precompile && bin/bundle exec rake spec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Generate binstubs
        run: bundle binstubs bundler-audit brakeman rubocop

      - name: Security audit dependencies
        run: bin/bundler-audit --update

      - name: Security audit application code
        run: bin/brakeman -q -w2

      - name: Lint Ruby files
        run: bin/rubocop --parallel

      - name: Comprehensive ESLint Debug
        run: |
          echo "=== Current working directory ==="
          pwd
          echo "=== Directory contents ==="
          ls -la
          echo "=== Looking for .eslintrc files ==="
          find . -name ".eslintrc*" -type f
          echo "=== Contents of root .eslintrc.json ==="
          cat ./.eslintrc.json || echo "No .eslintrc.json in root"
          echo "=== ESLint version ==="
          npx eslint --version
          echo "=== Node modules eslint location ==="
          ls -la node_modules/.bin/eslint || echo "No eslint in node_modules/.bin"
          echo "=== Which eslint binary ==="
          which eslint || echo "No eslint in PATH"
          echo "=== Trying to print config from root ==="
          npx eslint --print-config ./app/packs/scripts/admin_answer_question.js
          echo "=== Yarn bin directory ==="
          yarn bin eslint || echo "No yarn bin eslint"

      - name: Run ESLint
        working-directory: .
        run: bin/yarn lint

      - name: Run HAML-lint
        run: bin/bundle exec haml-lint
